; IBEX — Override PHP per-directory (PHP_INI_PERDIR).
; Letto automaticamente da php-fpm per qualsiasi script sotto /config/www.
;
; Introdotto con Sculpt V2 Sessione 3 (2026-04-22) per consentire l'upload
; di STL sculpted (potenzialmente >30MB con Upper.stl). Senza questi override
; PHP scartava silenziosamente $_POST interamente quando il body superava
; post_max_size (default 8M), risultando in "Dati Auth mancanti" nel client
; (saveSculpt non trovava $_POST['id']).
;
; Cache TTL: user_ini.cache_ttl = 300s (default). Dopo la modifica di questo
; file, il container può richiedere fino a 5 minuti per recepirlo, oppure
; restart esplicito: docker restart ibex-app

post_max_size       = 200M
upload_max_filesize = 200M
memory_limit        = 512M

; NOTA: max_execution_time resta al default (30s). checkPreview fa blPop 25s,
; saveSculpt fa blPop 30s — entrambi sotto il limite. Non alzare a meno
; di estendere anche il timeout lato worker.
